<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15191b" id="themeColor">
  <title>나의 식단·운동 기록</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="운동기록">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 아이콘: 같은 굵기의 단색 선 그림. 색깔 이모지 대신 (사용자: 이모지가 너무 많다). JS에서는 ic('이름') -->
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-dumbbell" viewBox="0 0 24 24"><path d="M6.5 6.5v11M3.5 9v6M17.5 6.5v11M20.5 9v6M6.5 12h11"/></symbol>
    <symbol id="i-food" viewBox="0 0 24 24"><path d="M7 3v8M5 3v4.5a2 2 0 0 0 4 0V3M7 11v10M16.5 3c-1.8 1-2.7 3.2-2.7 6.2 0 2.6 1.1 3.8 2.7 3.8V21"/></symbol>
    <symbol id="i-cal" viewBox="0 0 24 24"><path d="M3.5 5.5h17v15h-17zM3.5 10h17M8 3v4.5M16 3v4.5"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M3.5 8.5h3.7L9 6h6l1.8 2.5h3.7V19h-17z"/><circle cx="12" cy="13.3" r="3.3"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6.5h11.5M9 12h11.5M9 17.5h11.5M4 6.5h1.5M4 12h1.5M4 17.5h1.5"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 21c3.6 0 6-2.4 6-5.8 0-3.5-2.5-5.3-3.5-8.2-.5 1.6-1.4 2.6-2.5 3.3C12.5 7.6 11.5 5 9 3c.3 3-2.5 5-3.4 7.6A6.6 6.6 0 0 0 6 15.2C6 18.6 8.4 21 12 21z"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3.6-3.6a4 4 0 0 0-5.7-5.7L12 6.3M14 10a4 4 0 0 0-5.7 0l-3.6 3.6a4 4 0 0 0 5.7 5.7l1.6-1.6"/></symbol>
    <symbol id="i-focus" viewBox="0 0 24 24"><path d="M3.5 8.5v-5h5M20.5 8.5v-5h-5M3.5 15.5v5h5M20.5 15.5v5h-5"/><path d="M9.5 9.5h5v5h-5z"/></symbol>
    <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7"/><path d="M12 9.5v4l2.5 1.5M9.5 3h5M12 3v3.5"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.5 14.5A7.5 7.5 0 0 1 9.5 4.5a7.5 7.5 0 1 0 10 10z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.7 9.6a2.4 2.4 0 0 1 4.6.8c0 1.7-2.3 2.1-2.3 3.6M12 16.5v1"/></symbol>
    <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3.8s5.8 6.3 5.8 10.6a5.8 5.8 0 0 1-11.6 0C6.2 10.1 12 3.8 12 3.8z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5.5 5.5"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7.5 4.5v15l12-7.5z"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></symbol>
    <symbol id="i-plate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.5"/></symbol>
    <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.3l2.7 2.7L16.2 9.5"/></symbol>
    <symbol id="i-scale" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16"/><path d="M8 10.5a4.6 4.6 0 0 1 8 0M12 10.5l1.6-2.4"/></symbol>
    <symbol id="i-trend" viewBox="0 0 24 24"><path d="M3.5 20h17M4.5 15.5l4.5-4.5 3.5 3 7-7M15 7h4.5v4.5"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7.2 18.5h10a3.8 3.8 0 0 0 .5-7.57 5.7 5.7 0 0 0-11-.9A4.25 4.25 0 0 0 7.2 18.5Z"/><path d="M12 16v-5M9.8 13.2 12 11l2.2 2.2"/></symbol>
    <symbol id="i-install" viewBox="0 0 24 24"><path d="M12 4v10.5M7.8 10.3 12 14.5l4.2-4.2M5 19.5h14"/></symbol>
  </svg>
  <header class="top">
    <!-- 자주 안 쓰는 것(운동 시간·밝기·도움말)은 三 모양 메뉴로 (사용자 요구). 운동 시간이 도는 중이면 점 -->
    <button id="menuBtn" class="icon-btn menu-btn" aria-label="메뉴" aria-haspopup="dialog"><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="menu-dot" id="menuDot" hidden></span></button>
    <button id="prevDay" class="icon-btn" aria-label="이전 날">‹</button>
    <input type="date" id="date">
    <button id="nextDay" class="icon-btn" aria-label="다음 날">›</button>
    <button id="todayBtn" class="today-btn" hidden>오늘</button>
  </header>

  <!-- 운동이 주, 식단은 선택 (사용자 요구). 앱을 열면 운동 탭이 먼저 보인다 -->
  <nav class="tabs">
    <button class="tab active" data-tab="workouts"><svg class="ic" aria-hidden="true"><use href="#i-dumbbell"/></svg>운동</button>
    <button class="tab" data-tab="meals"><svg class="ic" aria-hidden="true"><use href="#i-food"/></svg>식단</button>
    <button class="tab" data-tab="history"><svg class="ic" aria-hidden="true"><use href="#i-cal"/></svg>기록</button>
  </nav>

  <!-- 기록을 잃을 위험 알림 (한 번에 하나). main 밖이라 날짜를 넘겨도 제자리 -->
  <div id="safetyBanner" class="safety-banner" hidden role="status"></div>

  <div id="datePill" class="date-pill" hidden></div>

  <main>
    <!-- 식단 -->
    <section id="meals" class="panel">
      <div class="summary" id="mealSummary"></div>
      <!-- 하루 목표: 다이어트·유지·벌크업을 고르면 목표를 계산하고 오늘 먹은 것과 견준다 (사용자 요구) -->
      <div class="card goal-card" id="goalCard">
        <div class="goal-head"><h3>하루 목표</h3><span class="goal-mode-note" id="goalNote"></span></div>
        <div class="seg goal-seg" id="goalSeg" role="tablist" aria-label="목표 종류"></div>
        <div id="goalBars"></div>
        <div id="goalForm"></div>
      </div>
      <div class="card meter" id="waterRow"></div>
      <form id="mealForm" class="card form">
        <!-- 사진이 가장 손이 덜 가는 길이라 맨 위에 크게 (사용자: 적는 게 귀찮아서 안 하게 된다) -->
        <label class="file-btn photo-pick big"><svg class="ic" aria-hidden="true"><use href="#i-camera"/></svg>사진으로 기록하기 <span id="photoName"></span>
          <input type="file" id="mealPhoto" accept="image/*" hidden>
        </label>
        <!-- 사진으로 알아본 결과 (vision.js). 이름을 비워 두고 사진을 고르면 뜬다 -->
        <div id="visionBox" class="vision-box" hidden aria-live="polite"></div>
        <select id="mealType">
          <option>아침</option><option>점심</option><option>저녁</option><option>간식</option>
        </select>
        <!-- 몇 글자만 쳐도 아래에 후보 (자주 먹은 음식이 위). "자주 먹는 음식" 칩 대신 (사용자 요구) -->
        <div class="food-name-wrap">
          <input id="foodName" placeholder="음식 이름 (예: 닭가슴살, 밥, 라면)" required autocomplete="off"
            role="combobox" aria-autocomplete="list" aria-controls="foodSuggest" aria-expanded="false">
          <div id="foodSuggest" class="suggest" role="listbox" aria-label="음식 후보" hidden></div>
        </div>
        <div class="row">
          <label>양<input id="foodAmount" placeholder="예: 200g, 1공기, 2개" autocomplete="off"></label>
          <label>칼로리(kcal)<input id="foodKcal" type="number" inputmode="numeric" min="0" placeholder="자동"></label>
          <label>단백질(g)<input id="foodProtein" type="number" inputmode="decimal" min="0" step="0.1" placeholder="자동"></label>
        </div>
        <p class="hint" id="mealHint"></p>
        <button type="submit" class="primary">식단 추가</button>
      </form>

      <div id="mealList"></div>

      <div id="myFoods"></div>
    </section>

    <!-- 운동 -->
    <section id="workouts" class="panel active">
      <div class="summary" id="workoutSummary"></div>
      <!-- 오늘의 운동: 분할 순서로 오늘 무슨 운동 차례인지, 지난번 그 날 뭘 했는지 (운동 전에 고르고 꺼내 온다) -->
      <div class="card split-card" id="splitCard" hidden></div>

      <button id="focusBtn" class="focus-entry" hidden></button>

      <!-- 운동 중엔 카드가 주인공이라 맨 위에. 운동 추가 폼은 그 아래("다음 운동"), 소모 칼로리·설정은 맨 아래 -->
      <div class="card" id="planCard" hidden></div>
      <div id="workoutList"></div>
      <form id="workoutForm" class="card form">
        <!-- 운동이 200가지가 넘어서 자동완성만으론 뭐가 있는지 모른다. "목록" 버튼으로 부위별 목록을 연다 -->
        <div class="ex-name-row">
          <input id="exName" list="exSuggestions" placeholder="운동 종류 (예: 스쿼트)" required autocomplete="off">
          <button type="button" class="ex-pick-btn" data-ex-pick="main" aria-label="목록에서 운동 고르기"><svg class="ic" aria-hidden="true"><use href="#i-list"/></svg>목록</button>
        </div>
        <datalist id="exSuggestions"></datalist>
        <!-- 부위는 이름으로 짐작하지만 풀오버·딥스처럼 애매한 건 앱이 모른다. 직접 누르면 그게 이긴다 -->
        <div id="partPick" class="part-pick"></div>
        <div class="row">
          <!-- 세트 수는 −/+로. 숫자를 지우고 다시 치면 빈칸 순간에 표가 1세트로 줄어 적어 둔 세트가 날아갔다 -->
          <label for="exSets">세트<span class="count-step">
            <button type="button" data-sets-step="-1" aria-label="세트 줄이기">−</button>
            <input id="exSets" type="number" inputmode="numeric" min="1" max="20" value="3" required>
            <button type="button" data-sets-step="1" aria-label="세트 늘리기">+</button>
          </span></label>
          <label>중량(kg)<input id="exWeight" type="number" inputmode="decimal" min="0" step="0.5" placeholder="맨몸"></label>
          <label>횟수<input id="exReps" type="number" inputmode="numeric" min="0" value="10" required></label>
          <!-- 운동 시간은 세트 수로 추정하므로 폼에서 뺐다(카드에서 고칠 수 있다). 대신 이 운동의 쉬는 시간 -->
          <label>휴식<select id="exRest"></select></label>
        </div>
        <!-- 세트별 무게·횟수 표가 기본. "모든 세트 같게"를 누르면 위의 중량·횟수 한 칸씩으로 바뀐다 -->
        <div id="perSetBox" class="perset"></div>
        <div class="perset-toggle-row"><button type="button" class="perset-toggle" id="warmupAuto"><svg class="ic" aria-hidden="true"><use href="#i-flame"/></svg>워밍업 자동</button><button type="button" class="perset-toggle" id="perSetToggle">모든 세트 같게</button></div>
        <p class="hint" id="exHint"></p>
        <!-- 슈퍼세트로 같이 넣을 운동들 (운동 순서가 처음부터 번갈아라 한 번에 넣는다) -->
        <div id="ssBox" class="ss-box"></div>
        <button type="button" class="ss-add" id="ssAdd"><svg class="ic" aria-hidden="true"><use href="#i-link"/></svg>슈퍼세트로 같이 추가</button>
        <button type="submit" class="primary">운동 추가</button>
      </form>
      <div class="card" id="routineCard" hidden></div>
      <!-- 소모 칼로리 창 -->
      <div class="card burn">
        <h3>오늘 소모 칼로리</h3>
        <div class="burn-total" id="burnTotal">0 <small>kcal</small></div>
        <div id="burnList"></div>
        <div class="row weight-row">
          <label>오늘 체중 (kg)
            <input id="bodyWeight" type="number" inputmode="decimal" min="20" max="250" step="0.1">
          </label>
          <label>중량 ± 단위
            <input id="weightStep" type="number" inputmode="decimal" min="0.5" max="20" step="0.5">
          </label>
          <label>기본 휴식 (초)
            <input id="restSec" type="number" inputmode="numeric" min="10" max="600" step="10">
          </label>
        </div>
      </div>

      <div class="card">
        <h3>오늘 메모</h3>
        <textarea id="dayNote" rows="2" placeholder="컨디션, 통증, 다음에 기억할 것…"></textarea>
      </div>
    </section>

    <!-- 기록 -->
    <section id="history" class="panel">
      <!-- 운동 달력: 날짜 밑에 한 부위, 누르면 그 날 운동이 아래에 -->
      <div class="card cal-card" id="calCard">
        <div class="cal-top" id="calTop"></div>
        <div class="cal-search" id="calSearch" hidden>
          <input id="historySearch" type="search" placeholder="운동·음식·메모 검색" autocomplete="off" aria-label="기록 검색">
          <div id="historyList"></div>
        </div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="cal-detail" id="calDetail" aria-live="polite"></div>
      </div>

      <div class="card" id="streakCard">
        <h3>운동 꾸준함</h3>
        <div class="tiles" id="streakTiles"></div>
        <p class="hint" id="streakMsg"></p>
      </div>

      <div class="card" id="reportCard" hidden>
        <h3>이번 주 요약 <span class="hint">지난주와 비교</span></h3>
        <div id="reportBody"></div>
      </div>

      <div class="card" id="weekCard">
        <div class="card-head">
          <h3 id="weekTitle">최근 7일</h3>
          <div class="seg" id="rangeSeg">
            <button data-range="7" class="on">7일</button>
            <button data-range="30">30일</button>
            <button data-range="90">90일</button>
          </div>
        </div>
        <div class="tiles" id="weekTiles"></div>
        <div id="weekChart"></div>
        <div class="legend">
          <span><i class="sw sw-1"></i>섭취</span>
          <span><i class="sw sw-2"></i>소모</span>
        </div>
      </div>

      <div class="card" id="balanceCard">
        <h3>부위별 밸런스</h3>
        <div id="balanceList"></div>
        <p class="hint" id="balanceHint"></p>
        <details class="help">
          <summary>주간 목표 세트 정하기</summary>
          <div class="goal-grid" id="partGoals"></div>
        </details>
      </div>

      <div class="card" id="volCard" hidden>
        <div class="card-head">
          <h3>부위별 볼륨 그래프</h3>
          <select id="volPick"></select>
        </div>
        <div id="volChart"></div>
        <div id="volGoalBox" class="goal-row"></div>
      </div>
    </section>
  </main>

  <div id="photoView" class="photo-view" hidden><img id="photoViewImg" alt=""></div>

  <!-- 三 메뉴로 옮긴 것들 (사용자: "기록에 부위별 볼륨 추이 밑으로 전부 메뉴에"). 운동 상세보다 앞에 둬야
       1RM 창에서 "자세히"를 눌렀을 때 상세가 위에 뜬다(같은 z-index면 뒤에 있는 게 위) -->
  <div id="weightSheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="weightTitle">
    <div class="sheet-head">
      <h2 id="weightTitle">체중 그래프</h2>
      <button class="del" id="weightClose" aria-label="닫기">✕</button>
    </div>
    <div class="sheet-body">
      <div class="seg range-seg"><button data-range="7" class="on">7일</button><button data-range="30">30일</button><button data-range="90">90일</button></div>
      <div id="weightChart"></div>
    </div>
  </div>

  <div id="liftSheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="liftTitle">
    <div class="sheet-head">
      <h2 id="liftTitle">운동별 1RM 그래프</h2>
      <button class="del" id="liftClose" aria-label="닫기">✕</button>
    </div>
    <div class="sheet-body">
      <div class="seg range-seg"><button data-range="7" class="on">7일</button><button data-range="30">30일</button><button data-range="90">90일</button></div>
      <select id="liftPick" class="lift-pick" aria-label="운동 고르기"></select>
      <div id="liftChart"></div>
      <button class="link-btn" id="liftDetail">이 운동 자세히 보기 ›</button>
    </div>
  </div>

  <div id="dataSheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="dataTitle">
    <div class="sheet-head">
      <h2 id="dataTitle">동기화·백업</h2>
      <button class="del" id="dataClose" aria-label="닫기">✕</button>
    </div>
    <div class="sheet-body data-body">
      <div class="card" id="syncCard"></div>
      <div class="card backup">
        <h3>백업</h3>
        <ul class="safety" id="safetyStatus"></ul>
        <div class="row">
          <button id="exportBtn">내보내기 (JSON)</button>
          <label class="file-btn">가져오기<input type="file" id="importFile" accept="application/json" hidden></label>
        </div>
        <div class="row">
          <button id="exportPhotoBtn">사진까지 내보내기</button>
          <button id="prunePhotoBtn">안 쓰는 사진 정리</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 운동 중 집중 모드: 지금 할 세트 하나만 크게. 상세처럼 main 밖에 둔다 -->
  <div id="focusSheet" class="sheet focus" hidden role="dialog" aria-modal="true" aria-labelledby="focusTitle">
    <div class="sheet-head">
      <h2 id="focusTitle">집중 모드</h2>
      <span class="muted" id="focusProgress"></span>
      <button class="del" id="focusClose" aria-label="닫기">✕</button>
    </div>
    <div class="focus-track"><span id="focusBar"></span></div>
    <div class="sheet-body focus-body" id="focusBody"></div>
  </div>

  <!-- 운동 상세. main 밖에 둬야 좌우 스와이프(날짜 이동)에 말려들지 않는다 -->
  <div id="exSheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="exSheetTitle">
    <div class="sheet-head">
      <h2 id="exSheetTitle"></h2>
      <button class="del" id="exSheetClose" aria-label="닫기">✕</button>
    </div>
    <div class="sheet-body" id="exSheetBody"></div>
  </div>

  <!-- 다른 날로 옮기기: 운동 카드·식단 하나·달력의 하루치 운동 -->
  <div id="moveSheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="moveTitle">
    <div class="sheet-head">
      <h2 id="moveTitle">다른 날로 옮기기</h2>
      <button class="del" id="moveClose" aria-label="닫기">✕</button>
    </div>
    <div class="sheet-body" id="moveBody"></div>
  </div>

  <!-- 원판 계산기: 바벨 무게 → 한쪽에 끼울 원판. 바 무게·있는 원판은 여기서 정한다 -->
  <div id="plateSheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="plateTitle">
    <div class="sheet-head">
      <h2 id="plateTitle">원판 계산기</h2>
      <button class="del" id="plateClose" aria-label="닫기">✕</button>
    </div>
    <div class="sheet-body" id="plateBody"></div>
  </div>

  <!-- 운동 고르기: 부위별 목록 + 검색. 누르면 운동 폼의 이름 칸에 들어간다 -->
  <div id="pickSheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="pickTitle">
    <div class="sheet-head">
      <h2 id="pickTitle">운동 고르기</h2>
      <button class="del" id="pickClose" aria-label="닫기">✕</button>
    </div>
    <div class="pick-top">
      <input id="pickSearch" type="search" placeholder="이름으로 찾기 (예: 사레레, 렛풀)" autocomplete="off" aria-label="운동 이름 검색">
      <div class="part-pick pick-tabs" id="pickTabs"></div>
    </div>
    <div class="sheet-body pick-list" id="pickList"></div>
  </div>

  <!-- 三 메뉴: 자주 안 쓰는 것들. 왼쪽에서 밀려 나오고, 바깥을 누르거나 뒤로가기로 닫힌다 -->
  <div id="menuSheet" class="drawer" hidden>
    <div class="drawer-backdrop" data-menu-close></div>
    <nav class="drawer-panel" role="dialog" aria-modal="true" aria-label="메뉴">
      <div class="drawer-head"><strong>메뉴</strong><button class="del" data-menu-close aria-label="메뉴 닫기">✕</button></div>
      <button class="drawer-item" id="timerOpen"><span class="drawer-ic"><svg class="ic" aria-hidden="true"><use href="#i-timer"/></svg></span><span class="drawer-tx">운동 시간<small id="menuTimerText"></small></span></button>
      <button class="drawer-item" id="weightOpen"><span class="drawer-ic"><svg class="ic" aria-hidden="true"><use href="#i-scale"/></svg></span><span class="drawer-tx">체중 그래프<small id="menuWeightText"></small></span></button>
      <button class="drawer-item" id="liftOpen"><span class="drawer-ic"><svg class="ic" aria-hidden="true"><use href="#i-trend"/></svg></span><span class="drawer-tx">1RM 그래프</span></button>
      <button class="drawer-item" id="dataOpen"><span class="drawer-ic"><svg class="ic" aria-hidden="true"><use href="#i-cloud"/></svg></span><span class="drawer-tx">동기화·백업<small id="menuDataText"></small></span></button>
      <button class="drawer-item" id="installBtn" hidden><span class="drawer-ic"><svg class="ic" aria-hidden="true"><use href="#i-install"/></svg></span><span class="drawer-tx">홈 화면에 설치</span></button>
      <div class="drawer-sep" role="separator"></div>
      <button class="drawer-item" id="themeBtn"><span class="drawer-ic" id="themeIc"><svg class="ic" aria-hidden="true"><use href="#i-moon"/></svg></span><span class="drawer-tx" id="themeTx">Theme</span></button>
      <button class="drawer-item" id="helpBtn"><span class="drawer-ic"><svg class="ic" aria-hidden="true"><use href="#i-help"/></svg></span><span class="drawer-tx">도움말</span></button>
    </nav>
  </div>

  <!-- 운동 시간: 시계 모양 + 아래에 크게 시간. 운동 탭에서 메뉴로 옮겼다(자리를 먹는데 잘 안 쓴다) -->
  <div id="timerSheet" class="sheet timer-sheet" hidden role="dialog" aria-modal="true" aria-labelledby="timerTitle">
    <div class="sheet-head">
      <h2 id="timerTitle">운동 시간</h2>
      <button class="del" id="timerClose" aria-label="닫기">✕</button>
    </div>
    <div class="sheet-body timer-body">
      <svg id="timerDial" class="timer-dial" viewBox="0 0 240 240" aria-hidden="true"></svg>
      <div id="timerClock" class="timer-clock" role="timer">0:00:00</div>
      <p id="sessionText" class="timer-status"></p>
      <button id="sessionBtn" class="timer-btn primary">▶️ 운동 시작</button>
    </div>
  </div>

  <!-- 도움말. 화면에 길게 적는 대신 여기로 모은다 (좁은 화면에서 설명이 글 벽이 된다) -->
  <div id="helpSheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="helpTitle">
    <div class="sheet-head">
      <h2 id="helpTitle">도움말</h2>
      <button class="del" id="helpClose" aria-label="닫기">✕</button>
    </div>
    <div class="sheet-body" id="helpBody"></div>
  </div>

  <!-- 아래 고정 바들. 같이 떠도 겹치지 않게 한 곳에 모아 세로로 쌓는다 -->
  <div class="dock">
    <!-- 휴식 타이머 버튼: 운동한 날 운동 탭에서 늘 화면 아래에 (사용자: "타이머가 어딨는지 모르겠다").
         누르면 아래 휴식 바(카운트다운)로 바뀐다 -->
    <button id="restFab" class="rest-fab" hidden aria-label="휴식 타이머 시작"><svg class="ic" aria-hidden="true"><use href="#i-timer"/></svg>휴식 <b id="restFabTime">1:30</b></button>
    <div id="restBar" class="rest-bar" hidden>
      <span class="rest-label"><svg class="ic" aria-hidden="true"><use href="#i-timer"/></svg>휴식</span>
      <strong id="restTime">0:00</strong>
      <button id="restPlus">+30초</button>
      <button id="restStop">정지</button>
    </div>
    <div id="undoBar" class="undo-bar" hidden>
      <span id="undoText"></span>
      <button id="undoBtn">되돌리기</button>
    </div>
  </div>

  <script src="food-db.js"></script>
  <script src="exercise-db.js"></script>
  <script src="photos.js"></script>
  <script src="sync.js"></script>
  <script src="report.js"></script>
  <script src="app.js"></script>
  <script src="vision.js"></script>
</body>
</html>
