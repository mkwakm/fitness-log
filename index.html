<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15191b" id="themeColor">
  <title>나의 식단·운동 기록</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="운동기록">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <button id="prevDay" class="icon-btn" aria-label="이전 날">‹</button>
    <input type="date" id="date">
    <button id="nextDay" class="icon-btn" aria-label="다음 날">›</button>
    <button id="todayBtn" class="today-btn" hidden>오늘</button>
    <button id="themeBtn" class="icon-btn" aria-label="밝기 전환" title="밝기 전환">🌙</button>
    <button id="helpBtn" class="icon-btn" aria-label="도움말" title="도움말">❓</button>
  </header>

  <!-- 운동이 주, 식단은 선택 (사용자 요구). 앱을 열면 운동 탭이 먼저 보인다 -->
  <nav class="tabs">
    <button class="tab active" data-tab="workouts">🏋️ 운동</button>
    <button class="tab" data-tab="meals">🍚 식단</button>
    <button class="tab" data-tab="history">📅 기록</button>
  </nav>

  <!-- 기록을 잃을 위험 알림 (한 번에 하나). main 밖이라 날짜를 넘겨도 제자리 -->
  <div id="safetyBanner" class="safety-banner" hidden role="status"></div>

  <div id="datePill" class="date-pill" hidden></div>

  <main>
    <!-- 식단 -->
    <section id="meals" class="panel">
      <div class="summary" id="mealSummary"></div>
      <div class="card meter" id="proteinBar" hidden></div>
      <div class="card meter" id="waterRow"></div>
      <form id="mealForm" class="card form">
        <!-- 사진이 가장 손이 덜 가는 길이라 맨 위에 크게 (사용자: 적는 게 귀찮아서 안 하게 된다) -->
        <label class="file-btn photo-pick big">📷 사진으로 기록하기 <span id="photoName"></span>
          <input type="file" id="mealPhoto" accept="image/*" hidden>
        </label>
        <!-- 사진으로 알아본 결과 (vision.js). 이름을 비워 두고 사진을 고르면 뜬다 -->
        <div id="visionBox" class="vision-box" hidden aria-live="polite"></div>
        <select id="mealType">
          <option>아침</option><option>점심</option><option>저녁</option><option>간식</option>
        </select>
        <input id="foodName" list="foodSuggestions" placeholder="음식 이름 (예: 닭가슴살, 밥, 라면)" required autocomplete="off">
        <datalist id="foodSuggestions"></datalist>
        <div class="row">
          <label>양<input id="foodAmount" placeholder="예: 200g, 1공기, 2개" autocomplete="off"></label>
          <label>칼로리(kcal)<input id="foodKcal" type="number" inputmode="numeric" min="0" placeholder="자동"></label>
          <label>단백질(g)<input id="foodProtein" type="number" inputmode="decimal" min="0" step="0.1" placeholder="자동"></label>
        </div>
        <p class="hint" id="mealHint"></p>
        <button type="submit" class="primary">식단 추가</button>
      </form>

      <div id="favFoods" class="card fav"></div>
      <button id="loadMeals" class="wide-btn"></button>
      <div id="mealList"></div>

      <div class="card">
        <h3>🎯 하루 목표</h3>
        <div class="row">
          <label>칼로리 (kcal)
            <input id="goalKcal" type="number" inputmode="numeric" min="0" step="50" placeholder="예: 2000">
          </label>
          <label>단백질 (g)
            <input id="proteinGoal" type="number" inputmode="numeric" min="0" step="5" placeholder="자동">
          </label>
        </div>
        <p class="hint" id="proteinGoalHint"></p>
      </div>
      <div id="myFoods"></div>
    </section>

    <!-- 운동 -->
    <section id="workouts" class="panel active">
      <div class="summary" id="workoutSummary"></div>
      <!-- 오늘의 운동: 분할 순서로 오늘 무슨 운동 차례인지, 지난번 그 날 뭘 했는지 (운동 전에 고르고 꺼내 온다) -->
      <div class="card split-card" id="splitCard" hidden></div>

      <div class="card session">
        <div>
          <h3>⏱ 운동 시간</h3>
          <p class="hint" id="sessionText"></p>
        </div>
        <button id="sessionBtn" class="primary">▶️ 운동 시작</button>
      </div>
      <button id="focusBtn" class="focus-entry" hidden></button>

      <!-- 운동 중엔 카드가 주인공이라 맨 위에. 운동 추가 폼은 그 아래("다음 운동"), 소모 칼로리·설정은 맨 아래 -->
      <div class="card" id="planCard" hidden></div>
      <div id="workoutList"></div>
      <form id="workoutForm" class="card form">
        <input id="exName" list="exSuggestions" placeholder="운동 종류 (예: 스쿼트)" required autocomplete="off">
        <datalist id="exSuggestions"></datalist>
        <!-- 부위는 이름으로 짐작하지만 풀오버·딥스처럼 애매한 건 앱이 모른다. 직접 누르면 그게 이긴다 -->
        <div id="partPick" class="part-pick"></div>
        <div class="row">
          <label>세트<input id="exSets" type="number" inputmode="numeric" min="1" value="3" required></label>
          <label>중량(kg)<input id="exWeight" type="number" inputmode="decimal" min="0" step="0.5" placeholder="맨몸"></label>
          <label>횟수<input id="exReps" type="number" inputmode="numeric" min="0" value="10" required></label>
          <label>시간(분)<input id="exMinutes" type="number" inputmode="numeric" min="0" step="1" placeholder="선택"></label>
        </div>
        <!-- 세트별 무게·횟수 표가 기본. "모든 세트 같게"를 누르면 위의 중량·횟수 한 칸씩으로 바뀐다 -->
        <div id="perSetBox" class="perset"></div>
        <div class="perset-toggle-row"><button type="button" class="perset-toggle" id="perSetToggle">모든 세트 같게</button></div>
        <p class="hint" id="exHint"></p>
        <!-- 슈퍼세트로 같이 넣을 운동들 (운동 순서가 처음부터 번갈아라 한 번에 넣는다) -->
        <div id="ssBox" class="ss-box"></div>
        <button type="button" class="ss-add" id="ssAdd">🔗 슈퍼세트로 같이 추가</button>
        <button type="submit" class="primary">운동 추가</button>
      </form>
      <button id="loadRoutine" class="wide-btn"></button>
      <div class="card" id="routineCard" hidden></div>
      <!-- 소모 칼로리 창 -->
      <div class="card burn">
        <h3>🔥 오늘 소모 칼로리</h3>
        <div class="burn-total" id="burnTotal">0 <small>kcal</small></div>
        <div id="burnList"></div>
        <div class="row weight-row">
          <label>오늘 체중 (kg)
            <input id="bodyWeight" type="number" inputmode="decimal" min="20" max="250" step="0.1">
          </label>
          <label>중량 ± 단위
            <input id="weightStep" type="number" inputmode="decimal" min="0.5" max="20" step="0.5">
          </label>
          <label>휴식 (초)
            <input id="restSec" type="number" inputmode="numeric" min="10" max="600" step="10">
          </label>
        </div>
        <p class="hint" id="weightHint"></p>
      </div>

      <div class="card">
        <h3>📝 오늘 메모</h3>
        <textarea id="dayNote" rows="2" placeholder="컨디션, 통증, 다음에 기억할 것…"></textarea>
      </div>
    </section>

    <!-- 기록 -->
    <section id="history" class="panel">
      <!-- 운동 달력: 날짜 밑에 한 부위, 누르면 그 날 운동이 아래에 -->
      <div class="card cal-card" id="calCard">
        <div class="cal-top" id="calTop"></div>
        <div class="cal-search" id="calSearch" hidden>
          <input id="historySearch" type="search" placeholder="운동·음식·메모 검색" autocomplete="off" aria-label="기록 검색">
          <div id="historyList"></div>
        </div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="cal-detail" id="calDetail" aria-live="polite"></div>
      </div>

      <div class="card" id="streakCard">
        <h3>🔥 운동 꾸준함</h3>
        <div class="tiles" id="streakTiles"></div>
        <p class="hint" id="streakMsg"></p>
      </div>

      <div class="card" id="reportCard" hidden>
        <h3>📰 이번 주 요약 <span class="hint">지난주와 비교</span></h3>
        <div id="reportBody"></div>
      </div>

      <div class="card" id="weekCard">
        <div class="card-head">
          <h3 id="weekTitle">📊 최근 7일</h3>
          <div class="seg" id="rangeSeg">
            <button data-range="7" class="on">7일</button>
            <button data-range="30">30일</button>
            <button data-range="90">90일</button>
          </div>
        </div>
        <div class="tiles" id="weekTiles"></div>
        <div id="weekChart"></div>
        <div class="legend">
          <span><i class="sw sw-1"></i>섭취</span>
          <span><i class="sw sw-2"></i>소모</span>
        </div>
      </div>

      <div class="card" id="balanceCard">
        <h3>🧩 부위별 밸런스</h3>
        <div id="balanceList"></div>
        <p class="hint" id="balanceHint"></p>
        <details class="help">
          <summary>주간 목표 세트 정하기</summary>
          <div class="goal-grid" id="partGoals"></div>
        </details>
      </div>

      <div class="card" id="volCard" hidden>
        <div class="card-head">
          <h3>💪 부위별 볼륨 추이</h3>
          <select id="volPick"></select>
        </div>
        <div id="volChart"></div>
        <div id="volGoalBox" class="goal-row"></div>
      </div>

      <div class="card" id="weightCard">
        <h3>⚖️ 체중 추이</h3>
        <div id="weightChart"></div>
      </div>

      <div class="card" id="liftCard">
        <div class="card-head">
          <h3>🏋️ 운동별 1RM 추이</h3>
          <select id="liftPick"></select>
        </div>
        <div id="liftChart"></div>
        <button class="link-btn" id="liftDetail">이 운동 자세히 보기 ›</button>
      </div>
      <button id="installBtn" class="wide-btn" hidden>📲 홈 화면에 앱으로 설치하기</button>
      <div class="card" id="syncCard"></div>
      <div class="card backup">
        <h3>백업</h3>
        <ul class="safety" id="safetyStatus"></ul>
        <div class="row">
          <button id="exportBtn">내보내기 (JSON)</button>
          <label class="file-btn">가져오기<input type="file" id="importFile" accept="application/json" hidden></label>
        </div>
        <div class="row">
          <button id="exportPhotoBtn">📷 사진까지 내보내기</button>
          <button id="prunePhotoBtn">🧹 안 쓰는 사진 정리</button>
        </div>
      </div>
    </section>
  </main>

  <div id="photoView" class="photo-view" hidden><img id="photoViewImg" alt=""></div>

  <!-- 운동 중 집중 모드: 지금 할 세트 하나만 크게. 상세처럼 main 밖에 둔다 -->
  <div id="focusSheet" class="sheet focus" hidden role="dialog" aria-modal="true" aria-labelledby="focusTitle">
    <div class="sheet-head">
      <h2 id="focusTitle">🎯 집중 모드</h2>
      <span class="muted" id="focusProgress"></span>
      <button class="del" id="focusClose" aria-label="닫기">✕</button>
    </div>
    <div class="focus-track"><span id="focusBar"></span></div>
    <div class="sheet-body focus-body" id="focusBody"></div>
  </div>

  <!-- 운동 상세. main 밖에 둬야 좌우 스와이프(날짜 이동)에 말려들지 않는다 -->
  <div id="exSheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="exSheetTitle">
    <div class="sheet-head">
      <h2 id="exSheetTitle"></h2>
      <button class="del" id="exSheetClose" aria-label="닫기">✕</button>
    </div>
    <div class="sheet-body" id="exSheetBody"></div>
  </div>

  <!-- 도움말. 화면에 길게 적는 대신 여기로 모은다 (좁은 화면에서 설명이 글 벽이 된다) -->
  <div id="helpSheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="helpTitle">
    <div class="sheet-head">
      <h2 id="helpTitle">❓ 도움말</h2>
      <button class="del" id="helpClose" aria-label="닫기">✕</button>
    </div>
    <div class="sheet-body" id="helpBody"></div>
  </div>

  <!-- 아래 고정 바들. 같이 떠도 겹치지 않게 한 곳에 모아 세로로 쌓는다 -->
  <div class="dock">
    <div id="restBar" class="rest-bar" hidden>
      <span class="rest-label">⏱ 휴식</span>
      <strong id="restTime">0:00</strong>
      <button id="restPlus">+30초</button>
      <button id="restStop">정지</button>
    </div>
    <div id="undoBar" class="undo-bar" hidden>
      <span id="undoText"></span>
      <button id="undoBtn">되돌리기</button>
    </div>
  </div>

  <script src="food-db.js"></script>
  <script src="photos.js"></script>
  <script src="sync.js"></script>
  <script src="app.js"></script>
  <script src="vision.js"></script>
</body>
</html>
